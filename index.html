<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>H A R S H A trading Journal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#0b0f14;--panel:#111823;--panel2:#0f1622;--text:#e6edf3;--muted:#9aa4b2;--green:#22c55e;--green-bg:rgba(34, 197, 94, 0.35);--red:#ef4444;--red-bg:rgba(239, 68, 68, 0.35);--blue:#3b82f6;--radius:14px;--empty:rgba(255, 255, 255, 0.35)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text); display: flex; flex-direction: column; align-items: center;}
header{width: 100%; padding:16px 24px; border-bottom:1px solid #1b2330; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px}
h1{font-size:18px; margin:0}
.header-btns{display:flex; gap:8px; align-items:center}
.balance-input{background:#111823; border:1px solid #333; color:var(--green); padding:8px; border-radius:8px; width:90px; font-weight:bold}
select.profile-select, select.year-select, .growth-view-select{background:#1b2330; color:var(--blue); border:1px solid var(--blue); padding:8px; border-radius:8px; font-weight:bold; cursor:pointer}
button{background:#0c1320;border:1px solid #1b2330;color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px}

main{width: 100%; max-width: 1200px; padding:20px 24px; display:flex; flex-direction: column; gap:16px;}
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:16px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid #1b2330; border-radius:var(--radius); padding:16px; display: flex; flex-direction: column;}
.kpi{grid-column:span 2}

.chart-container-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; width: 100%; }
.chart-card { grid-column: span 8; height: 350px; }
.side-card { grid-column: span 4; height: 350px; }
.chart-wrapper { flex-grow: 1; position: relative; width: 100%; height: 100%; }

.label{color:var(--muted); font-size:11px; text-transform: uppercase; margin-bottom: 4px}
.value{font-size:20px; font-weight:700}

.month-container { width: 100%; display: flex; justify-content: center; margin-top: 10px; }
.month-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; width: 100%; }
.month-rect { height: 100px; border: 2px solid rgba(59, 130, 246, 0.5); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
.month-rect:hover { transform: translateY(-3px); border-color: rgba(59, 130, 246, 1); background: rgba(59, 130, 246, 0.1); }
.month-name { color: white; font-weight: bold; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }

#monthModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal-content { background: var(--panel); width: 95%; max-width: 1100px; max-height: 85vh; border-radius: 14px; border: 1px solid #333; overflow: hidden; display: flex; flex-direction: column; }

/* New Popup Header Style */
.popup-kpi-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #1b2330; border-bottom: 1px solid #333; }
.popup-kpi-item { background: #0c1320; padding: 15px; text-align: center; }

#panel{position:fixed; top:0; right:-100%; width:420px; height:100%; background:#0c1320; border-left:1px solid #1b2330; transition:.4s; padding:24px; overflow:auto; z-index:110}
#panel.open{right:0}
.form-grid{display:grid; grid-template-columns: 1fr 1fr; gap:16px; align-items: start;}
.form-grid h3, .form-grid textarea, .form-grid .full-col, .form-grid .btn-container { grid-column: span 2; }

input,select,textarea{background:#111823; border:1px solid #333; color:var(--text); border-radius:8px; padding:12px; width: 100%; font-size: 13px;}
table{width:100%; border-collapse:collapse; font-size:12px}
th,td{border-bottom:1px solid #1b2330; padding:10px 8px; text-align:left}

@media(max-width:1000px){
    .month-grid { grid-template-columns: repeat(3, 1fr); }
    .kpi { grid-column: span 4; }
    .chart-card, .side-card { grid-column: span 12; height: 300px; }
}
</style>
</head>
<body>

<header>
    <h1>H A R S H A</h1>
    <div class="header-btns">
        <select id="growthView" class="growth-view-select" onchange="render()">
            <option value="all">All-Time Growth</option>
            <option value="yearly">Yearly Growth</option>
        </select>
        <select id="profileSwitcher" class="profile-select" onchange="changeProfile()"></select>
        <select id="yearSwitcher" class="year-select" onchange="render()"></select>
        <button onclick="createProfile()">📁 New Profile</button>
        <div style="text-align:right">
            <div class="label" style="margin-bottom:2px">Start $</div>
            <input type="number" id="startBalance" class="balance-input" value="1000" onchange="updateStartBalance()">
        </div>
        <button onclick="openPanel()">➕ Add Trade</button>
    </div>
</header>

<main>
    <section class="grid">
        <div class="card kpi"><div class="label" id="growthLabel">Growth</div><div class="value" id="kGrowth">0%</div></div>
        <div class="card kpi"><div class="label">Balance</div><div class="value" id="kBalance">$0</div></div>
        <div class="card kpi"><div class="label">P&L</div><div class="value" id="kProfit">$0</div></div>
        <div class="card kpi"><div class="label">Win Rate</div><div class="value" id="kWin">0%</div></div>
        <div class="card kpi"><div class="label">Discipline</div><div class="value" id="kDiscipline">100%</div></div>
        <div class="card kpi"><div class="label">Best Pair</div><div class="value" id="kBestPair">-</div></div>
    </section>

    <section class="chart-container-row">
        <div class="card chart-card">
            <h3 style="margin:0 0 10px 0; font-size:14px;">Equity Growth</h3>
            <div class="chart-wrapper"><canvas id="equity"></canvas></div>
        </div>
        <div class="card side-card">
            <h3 style="margin:0 0 10px 0; font-size:14px;">Session Performance</h3>
            <div class="chart-wrapper"><canvas id="sessionChart"></canvas></div>
        </div>
    </section>

    <div class="month-container"><section class="month-grid" id="monthGrid"></section></div>
</main>

<div id="monthModal">
    <div class="modal-content" id="captureTarget">
        <div class="popup-kpi-bar">
            <div class="popup-kpi-item"><div class="label">Monthly Profit</div><div id="popMProfit" class="value" style="font-size:18px;">$0</div></div>
            <div class="popup-kpi-item"><div class="label">Monthly Growth</div><div id="popMGrowth" class="value" style="font-size:18px;">0%</div></div>
            <div class="popup-kpi-item"><div class="label">Best Pair</div><div id="popMBest" class="value" style="font-size:18px;">-</div></div>
        </div>
        <div style="padding: 10px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #111823;">
            <h2 id="modalTitle" style="margin:0">Month</h2>
            <div style="display: flex; gap: 8px;">
                <button onclick="downloadCSV()" style="background: #22c55e; border:none; color:white;">📥 CSV</button>
                <button onclick="closeMonthModal()">Close</button>
            </div>
        </div>
        <div style="padding: 20px; overflow-y: auto; background: #111823;">
            <table id="monthTable">
                <thead><tr><th>Pair</th><th>Date</th><th>P&L</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="monthRows"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="panel">
    <div class="form-grid">
        <h3 id="panelHeader">New Trade</h3>
        <div class="field-group"><label>Pair</label><input id="pair" placeholder="e.g. GOLD"/></div>
        <div class="field-group"><label>Date</label><input id="date" type="date"/></div>
        <div class="field-group"><label>Profit ($)</label><input id="profit" type="number" step="0.01"/></div>
        <div class="field-group"><label>Side</label><select id="side"><option>Buy</option><option>Sell</option></select></div>
        <div class="field-group"><label>Session</label><select id="session"><option>Asian</option><option>London</option><option>New York</option></select></div>
        <div class="field-group full-col"><label>Execution</label><select id="mistake"><option>Perfect Execution</option><option>FOMO Entry</option></select></div>
        <div class="btn-container"><button class="save-btn" onclick="saveTrade()">Save</button><button class="cancel-btn" onclick="closePanel()">Cancel</button></div>
    </div>
</div>

<script>
let trades = JSON.parse(localStorage.getItem('trades') || '[]');
let profiles = JSON.parse(localStorage.getItem('h_profiles') || '["Main Account"]');
let currentProfile = localStorage.getItem('h_current_profile') || profiles[0];
let profileBalances = JSON.parse(localStorage.getItem('h_balances') || '{}');

const equityChart = new Chart(document.getElementById('equity'), { type:'line', data:{ labels:[], datasets:[{ data:[], borderColor:'#3b82f6', fill:true, tension:0.3 }] }, options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} } });
const sessChart = new Chart(document.getElementById('sessionChart'), { type:'bar', data:{ labels:['Asian','London','New York'], datasets:[{ data:[0,0,0], backgroundColor:['#3b82f6','#22c55e','#ef4444'] }] }, options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} } });

function init() { initProfiles(); initYears(); render(); }
function initProfiles() { 
    const ps = document.getElementById('profileSwitcher'); ps.innerHTML = ''; 
    profiles.forEach(p => { let opt = document.createElement('option'); opt.value = p; opt.textContent = p; if(p===currentProfile) opt.selected=true; ps.appendChild(opt); }); 
    document.getElementById('startBalance').value = profileBalances[currentProfile] || 1000; 
}
function initYears() { const ys = document.getElementById('yearSwitcher'); ys.innerHTML = '<option value="2025">2025</option>'; }

function render() {
    const selYear = parseInt(document.getElementById('yearSwitcher').value);
    const viewMode = document.getElementById('growthView').value;
    const profTrades = trades.filter(t => t.profile === currentProfile);
    const yearTrades = profTrades.filter(t => new Date(t.date).getFullYear() === selYear).sort((a,b)=>new Date(a.date)-new Date(b.date));

    let startBal = Number(document.getElementById('startBalance').value);
    let totalPnl = profTrades.reduce((s, t) => s + t.profit, 0);
    let yearPnl = yearTrades.reduce((s, t) => s + t.profit, 0);

    // Growth Logic
    let growthVal = viewMode === 'all' ? (totalPnl/startBal)*100 : (yearPnl/startBal)*100;
    document.getElementById('growthLabel').textContent = viewMode === 'all' ? 'All-Time Growth' : 'Yearly Growth';
    document.getElementById('kGrowth').textContent = growthVal.toFixed(1) + '%';
    document.getElementById('kGrowth').style.color = growthVal >= 0 ? 'var(--green)' : 'var(--red)';

    document.getElementById('kProfit').textContent = `$${yearPnl.toFixed(2)}`;
    document.getElementById('kBalance').textContent = `$${(startBal + yearPnl).toFixed(2)}`;
    
    // Grid
    const grid = document.getElementById('monthGrid'); grid.innerHTML = '';
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    months.forEach((name, idx) => {
        const mTrades = yearTrades.filter(t => new Date(t.date).getMonth() === idx);
        const mPnl = mTrades.reduce((s, t) => s + t.profit, 0);
        let bg = mTrades.length ? (mPnl >= 0 ? 'var(--green-bg)' : 'var(--red-bg)') : 'rgba(255,255,255,0.05)';
        grid.innerHTML += `<div class="month-rect" style="background:${bg}" onclick="openMonth('${name}', ${idx})"><div class="month-name">${name}</div><div style="color:${mPnl>=0?'var(--green)':'var(--red)'}">${mTrades.length?'$'+mPnl.toFixed(0):'$0'}</div></div>`;
    });

    // Charts update...
    let run = startBal;
    equityChart.data.labels = yearTrades.map((_,i)=>i+1);
    equityChart.data.datasets[0].data = yearTrades.map(t => { run += t.profit; return run; });
    equityChart.update();
}

function openMonth(name, idx) {
    const selYear = parseInt(document.getElementById('yearSwitcher').value);
    const startBal = Number(document.getElementById('startBalance').value);
    const mTrades = trades.filter(t => t.profile === currentProfile && new Date(t.date).getFullYear() === selYear && new Date(t.date).getMonth() === idx);
    
    // Calculate Monthly Header
    const mProfit = mTrades.reduce((s,t) => s + t.profit, 0);
    let pairs = {}; mTrades.forEach(t => { pairs[t.pair] = (pairs[t.pair]||0) + t.profit; });
    const best = Object.entries(pairs).sort((a,b)=>b[1]-a[1])[0];

    document.getElementById('popMProfit').textContent = `$${mProfit.toFixed(2)}`;
    document.getElementById('popMGrowth').textContent = ((mProfit/startBal)*100).toFixed(1) + '%';
    document.getElementById('popMBest').textContent = best ? best[0] : '-';
    
    document.getElementById('modalTitle').textContent = name;
    const rows = document.getElementById('monthRows'); rows.innerHTML = '';
    mTrades.forEach(t => { rows.innerHTML += `<tr><td>${t.pair}</td><td>${t.date}</td><td>${t.profit}</td><td>${t.mistake}</td><td><button onclick="deleteTrade(${trades.indexOf(t)})">X</button></td></tr>`; });
    document.getElementById('monthModal').style.display = 'flex';
}

function saveTrade() {
    const t = { profile: currentProfile, pair: document.getElementById('pair').value.toUpperCase(), date: document.getElementById('date').value, profit: Number(document.getElementById('profit').value), side: document.getElementById('side').value, session: document.getElementById('session').value, mistake: document.getElementById('mistake').value };
    trades.push(t); localStorage.setItem('trades', JSON.stringify(trades)); closePanel(); render();
}

function closeMonthModal() { document.getElementById('monthModal').style.display = 'none'; }
function openPanel() { document.getElementById('panel').classList.add('open'); }
function closePanel() { document.getElementById('panel').classList.remove('open'); }
function changeProfile() { currentProfile = document.getElementById('profileSwitcher').value; render(); }
function updateStartBalance() { profileBalances[currentProfile] = Number(document.getElementById('startBalance').value); localStorage.setItem('h_balances', JSON.stringify(profileBalances)); render(); }
function createProfile() { let n = prompt("Profile:"); if(n) { profiles.push(n); localStorage.setItem('h_profiles', JSON.stringify(profiles)); currentProfile=n; initProfiles(); render(); } }

init();
</script>
</body>
</html>
